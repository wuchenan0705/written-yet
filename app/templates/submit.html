{% extends "base.html" %}{% block body %}
<h1>交題目</h1>
{% if error %}<div class="note bad">{{ error }}</div>{% endif %}
<form method="post" enctype="multipart/form-data" id="f">
<div class="sheet">
<fieldset class="bare"><legend>科目</legend>
<div class="seg">{% for s in SKILLS %}<input type="radio" name="skill" id="sk-{{ s }}" value="{{ s }}" {{ 'checked' if s == skill }}><label for="sk-{{ s }}">{{ SKILL_ZH[s] }}</label>{% endfor %}</div>
</fieldset>
<p class="muted">一次交一篇：一篇閱讀、一個聽力 Section、一篇作文或一組口說。</p>
</div>

<div class="sheet">
<label for="files" style="margin-top:0">雅思哥檢討頁截圖</label>
<label class="drop" id="drop" for="files">
  <input type="file" name="files" id="files" accept="image/*" multiple>
  <span>選擇截圖，或直接貼上（⌘V）</span>
  <span class="muted">要截到每組題目下方「正确答案／我的答案」那塊，可以多張。</span>
</label>
<div id="previews" class="thumbs"></div>

<label for="text">文字</label>
<textarea name="text" id="text" placeholder="從雅思哥複製的文章和題目、你的作文或口說回答。只交截圖也可以。">{{ text }}</textarea>

<div id="answers-box">
<label for="answers">我的答案</label>
<input name="answers" id="answers" placeholder="11B 12A 13C 37 NO 38 NG" autocomplete="off">
<p class="muted">從雅思哥複製文字時，選擇題和 YES/NO/NOT GIVEN 的勾選會消失。在這裡補上就能直接計分，沒有就留空。</p>
</div>

<details class="fold"><summary>填寫出處</summary>
<p class="muted">不填也可以，會從截圖標題判斷，例如 C21-Test 1-Passage 3。</p>
<div class="grid2">
<div><label for="book">書本</label><input name="book" id="book" placeholder="C21"></div>
<div><label for="test">Test</label><input name="test" id="test" placeholder="Test 1"></div>
<div><label for="part">Part / Passage</label><input name="part" id="part" placeholder="Passage 3"></div>
</div></details>
</div>
<button id="go" class="wide">送出批改</button>
</form>
<style>
fieldset.bare{border:0;margin:0;padding:0}
fieldset.bare legend{font-weight:500;font-size:.9rem;margin-bottom:8px;padding:0}
.drop{display:flex;flex-direction:column;align-items:center;gap:2px;padding:22px 16px;border:1.5px dashed var(--rule);border-radius:10px;background:var(--paper);text-align:center;cursor:pointer;font-weight:500}
.drop:hover,.drop.over{border-color:var(--ink)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs img{height:84px;border:1px solid var(--rule);border-radius:6px}
#f details{margin-top:14px}
</style>
<script>
const input = document.getElementById('files');
const box = document.getElementById('previews');
const drop = document.getElementById('drop');
function show() {
  box.innerHTML = '';
  for (const f of input.files) {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.alt = f.name;
    box.appendChild(img);
  }
  drop.querySelector('span').textContent = input.files.length ? `已選 ${input.files.length} 張，可以再貼上或重選` : '選擇截圖，或直接貼上（⌘V）';
}
function add(files) {
  const dt = new DataTransfer();
  for (const f of input.files) dt.items.add(f);
  files.forEach((f, i) => dt.items.add(new File([f], f.name || `paste-${Date.now()}-${i}.png`, {type: f.type})));
  input.files = dt.files;
  show();
}
input.addEventListener('change', show);
document.addEventListener('paste', (e) => {
  const pasted = [...e.clipboardData.files].filter(f => f.type.startsWith('image/'));
  if (!pasted.length) return;
  e.preventDefault();
  add(pasted);
});
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => {
  e.preventDefault(); drop.classList.remove('over');
  add([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
});
const answersBox = document.getElementById('answers-box');
function syncSkill() {
  const s = document.querySelector('input[name=skill]:checked');
  answersBox.hidden = s && !['listening', 'reading'].includes(s.value);
}
document.querySelectorAll('input[name=skill]').forEach(r => r.addEventListener('change', syncSkill));
syncSkill();
document.getElementById('f').addEventListener('submit', () => {
  const b = document.getElementById('go');
  b.disabled = true;
  b.textContent = '批改中，約 30–60 秒';
});
</script>
{% endblock %}
