{% extends "base.html" %}{% block body %}
<h1>罰金帳本</h1>
<section class="sheet">
<p class="muted" style="margin:0">未付總額</p>
<p class="total {{ 'bad' if total }}">{{ total }}</p>
<p class="muted">付給：{{ st.fine_note }}。這裡只記帳，轉帳請自己處理，付完按「標記已付」。</p>
</section>
<section class="sheet"><table>
<thead><tr><th>日期</th><th>金額</th><th></th></tr></thead>
<tbody>{% for f in items %}<tr><td>{{ f.date }}</td><td>{{ f.amount }}</td><td style="text-align:right">
{% if f.paid %}<span class="ok">{{ f.paid_at.strftime('%m/%d') }} 已付</span>{% else %}
<form method="post" action="/fines/{{ f.id }}/paid"><button class="quiet">標記已付</button></form>{% endif %}
</td></tr>{% else %}<tr><td colspan="3" class="muted">還沒有罰金。</td></tr>{% endfor %}</tbody>
</table></section>
<style>.total{font-size:2.4rem;font-weight:700;line-height:1.2;margin:2px 0 6px}</style>
{% endblock %}
