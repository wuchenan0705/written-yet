[project]
name = "written-yet"
version = "0.1.0"
description = "LINE bot + web dashboard that keeps you practising IELTS and reviews your mistakes with Claude"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlmodel==0.0.24",
    "apscheduler==3.11.0",
    "line-bot-sdk==3.17.1",
    "anthropic>=1.15.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
